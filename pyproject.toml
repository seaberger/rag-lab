[project]
name = "rag-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12.7",
    "llama-index>=0.12.40",
    "llama-index-embeddings-openai>=0.3.1",
    "llama-index-vector-stores-qdrant>=0.6.0",
    "lz4>=4.4.4",
    "matplotlib>=3.10.3",
    "pdf2image>=1.17.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.0",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
    "tenacity>=9.1.2",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-html>=4.1.1",
    "pytest-json-report>=1.5.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0.0",
    "types-tqdm>=4.66.0",
    "types-aiofiles>=23.2.0",
    "pip-audit>=2.7.0",
    "bandit[toml]>=1.7.5",
    "safety>=3.0.0",
    "pre-commit>=3.5.0",
    "pytest-timeout>=2.4.0",
]

[tool.bandit]
exclude_dirs = ["/tests/", "/test/", "test_*.py", "*_test.py", "/cache_v3/", "/qdrant_data_v3/", "/storage_data_v3/", "/data/"]
skips = ["B101", "B601"]
tests = ["B201", "B301", "B302", "B303", "B304", "B305", "B306", "B307", "B308", "B309", "B310", "B311", "B312", "B313", "B314", "B315", "B316", "B317", "B318", "B319", "B320", "B321", "B323", "B324", "B401", "B402", "B403", "B404", "B405", "B406", "B407", "B408", "B409", "B410", "B411", "B412", "B413", "B501", "B502", "B503", "B504", "B505", "B506", "B507", "B602", "B603", "B604", "B605", "B606", "B607", "B608", "B609", "B610", "B611", "B701", "B702", "B703"]

[tool.ruff]
# Exclude backup directories and other non-production code
exclude = [
    "**/backups/",
    "**/backup/",
    "**/legacy_backup/",
    "**/*_backup.py",
    "**/archive/",
    "**/old/",
    "**/deprecated/",
    # Exclude standalone test files in root directory
    "test_*.py",
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "node_modules",
]

# Target Python 3.12
target-version = "py312"

# Line length to match Black's default
line-length = 100

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "B",    # flake8-bugbear
    "G",    # flake8-logging
    "TRY",  # tryceratops (exception handling)
    "PLC",  # pylint convention
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
    "PTH",  # flake8-use-pathlib
    "EXE",  # flake8-executable
]

# Ignore specific rules
ignore = [
    "E501",    # line too long (handled by formatter)
    "E402",    # module import not at top of file
    "B008",    # do not perform function calls in argument defaults
    "S101",    # use of assert detected
    "TRY003",  # long exception messages
    "S110",    # try-except-pass without logging
]
