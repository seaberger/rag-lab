# Ruff configuration for RAG Lab
# Fast, modern Python linter and formatter

# Exclude common directories
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "venv",
    ".env",
    "build",
    "dist",
    "*.egg-info",
    ".tox",
    ".coverage",
    "htmlcov",
    ".prof",
    "cache_v3",
    "qdrant_data_v3",
    "storage_data_v3",
    "data",
    # Exclude backup directories
    "**/backups/",
    "**/backup/",
    "**/legacy_backup/",
    "**/*_backup.py",
    # Exclude standalone test files in root
    "test_*.py",
]

# Target Python 3.12+
target-version = "py312"

# Line length to match common standards
line-length = 100

# Enable pyflakes, pycodestyle, and more
[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "B",     # flake8-bugbear
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "S",     # flake8-bandit security
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "EXE",   # flake8-executable
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "G",     # flake8-logging-format
    "PIE",   # flake8-pie
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RSE",   # flake8-raise
    "RET",   # flake8-return
    "SLF",   # flake8-self
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "TCH",   # flake8-type-checking
    "ARG",   # flake8-unused-arguments
    "PTH",   # flake8-use-pathlib
    "PD",    # pandas-vet
    "PGH",   # pygrep-hooks
    "PL",    # pylint
    "TRY",   # tryceratops
    "NPY",   # numpy specific rules
    "RUF",   # ruff specific rules
]

# Ignore specific rules
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # use of assert (needed for tests)
    "S608",   # SQL injection (we use parameterized queries)
    "PLR0913", # too many arguments
    "PLR2004", # magic values
    "TRY003",  # long exception messages
    "ISC001",  # conflicts with formatter
    "RET504",  # unnecessary variable assignment before return
    "SIM108",  # ternary operator (sometimes less readable)
    "G004",    # logging uses f-string
    "PTH110",  # os.path.exists
    "PTH123",  # open() vs Path.open()
    "TRY300",  # consider else block
    "T201",    # print statements
    "E402",    # module import not at top
    "PLW0603", # global statement
    "A001",    # builtin shadowing
    "N802",    # function name lowercase
    "RET505",  # unnecessary else after return
    "RUF012",  # mutable class attributes
    "UP007",   # use X | Y for union types
    "TRY002",  # raise vanilla exception
    "ARG001",  # unused function argument
    "ARG002",  # unused method argument
    "PD011",   # pandas .values
    "SIM102",  # use single if
    "SIM401",  # use dict.get
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "C901",    # too complex
    "B008",    # function call in default argument
    "B904",    # raise without from inside except
    "RUF003",  # ambiguous unicode character
    "PLW2901", # loop variable overwritten
    "PGH003",  # specific type ignore
    "SLF001",  # private member access
    "TRY201",  # raise without raise from
    "RET503",  # missing return
    "UP006",   # use list/dict instead of List/Dict
    "UP035",   # import replacements
    "FA100",   # future annotations
    "TID252",  # relative imports
    "PTH118",  # os.path.join
    "PTH120",  # os.path.dirname
    "B018",    # useless expression
    "SIM117",  # multiple with statements
    "PLR1714", # repeated equality comparisons
    "DTZ005",  # datetime.now without timezone
    "DTZ011",  # datetime.date.today
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# Allow assert in test files
"test_*.py" = ["S101", "PLR2004", "ARG001"]
"*_test.py" = ["S101", "PLR2004", "ARG001"]
"tests/*.py" = ["S101", "PLR2004", "ARG001"]

# Allow print statements in CLI
"cli*.py" = ["T201"]
"**/cli/*.py" = ["T201"]

# Migration files may have complex logic
"**/migrations/*.py" = ["PLR0912", "PLR0915", "C901"]

[lint.isort]
known-first-party = ["src"]

[lint.mccabe]
# Complexity threshold
max-complexity = 15

[lint.pep8-naming]
# Allow Pytest style class names
classmethod-decorators = ["classmethod", "pydantic.validator"]

[lint.pylint]
max-args = 8
max-branches = 15
max-returns = 6
max-statements = 50

[lint.pyupgrade]
# Preserve runtime typing for < 3.12
keep-runtime-typing = true

[format]
# Use double quotes for strings
quote-style = "double"

# Indent with spaces
indent-style = "space"

# Respect magic trailing commas
skip-magic-trailing-comma = false

# Unix-style line endings
line-ending = "auto"
