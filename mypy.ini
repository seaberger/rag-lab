[mypy]
# MyPy configuration for RAG Lab
# Type checking for Python 3.12+

python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_optional = True
strict_equality = True
namespace_packages = True
pretty = True
show_error_codes = True
show_error_context = True
show_column_numbers = True

# Be lenient about third-party libraries without type hints
ignore_missing_imports = True

# Exclude test files from strict typing
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False

[mypy-src.pipeline_v3.tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False

# Third-party libraries that don't have stubs
[mypy-pdf2image.*]
ignore_missing_imports = True

[mypy-llama_index.*]
ignore_missing_imports = True

[mypy-qdrant_client.*]
ignore_missing_imports = True

[mypy-tenacity.*]
ignore_missing_imports = True

[mypy-rich.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-lz4.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-docx.*]
ignore_missing_imports = True

[mypy-pptx.*]
ignore_missing_imports = True
