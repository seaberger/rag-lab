[tool:pytest]
# PyTest configuration for RAG Lab

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = src/pipeline_v3/tests

# Minimum Python version
minversion = 8.0

# Add src to Python path for imports
pythonpath = .

# Command line options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --capture=no
    -ra
    --maxfail=3
    --disable-warnings
    --asyncio-mode=auto

# Markers for organizing tests
markers =
    unit: Unit tests that test individual components
    integration: Integration tests that test multiple components
    regression: Regression tests to prevent bugs from reoccurring
    slow: Tests that take a long time to run
    security: Security-focused tests
    requires_api: Tests that require OpenAI API key
    requires_postgres: Tests that require PostgreSQL database
    requires_qdrant: Tests that require Qdrant vector database server
    requires_qdrant_server: Tests that require Qdrant vector database server
    e2e: End-to-end tests that test complete workflows
    smoke: Quick smoke tests for basic functionality
    heavy: Heavy tests that use significant resources
    server: Tests that require server components
    postgresql: Tests specific to PostgreSQL backend

# Coverage settings
[coverage:run]
source = src/pipeline_v3
branch = True
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */migrations/*
    */legacy_backup/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
fail_under = 70

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml
