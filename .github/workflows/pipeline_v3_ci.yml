name: Pipeline v3 CI

on:
  push:
    branches: [ main, develop, 'feature/*' ]
    paths:
      - 'src/pipeline_v3/**'
      - 'tests/**'
      - '.github/workflows/pipeline_v3_ci.yml'
      - 'pyproject.toml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/pipeline_v3/**'
      - 'tests/**'
      - '.github/workflows/pipeline_v3_ci.yml'
      - 'pyproject.toml'

env:
  PYTHON_VERSION: '3.12'
  UV_VERSION: '0.5.13'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:6333/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better caching

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Cache uv dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install dependencies
      run: |
        uv sync --all-extras --dev
        uv pip install pytest-timeout pytest-xdist

    - name: Create test environment
      run: |
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
        mkdir -p test_data

    - name: Run unit tests
      run: |
        uv run pytest src/pipeline_v3/tests/unit/ -v \
          --cov=src.pipeline_v3 \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --junit-xml=test-results/unit-results.xml

    - name: Run security tests
      run: |
        uv run pytest src/pipeline_v3/tests/security/ -v \
          --cov=src.pipeline_v3 \
          --cov-append \
          --junit-xml=test-results/security-results.xml

    - name: Run smoke integration tests
      run: |
        uv run pytest src/pipeline_v3/tests/integration/ -v \
          --timeout=300 \
          --cov=src.pipeline_v3 \
          --cov-append \
          --junit-xml=test-results/smoke-integration-results.xml \
          -m "smoke"

    - name: Run lightweight integration tests
      run: |
        uv run pytest src/pipeline_v3/tests/integration/ -v \
          --timeout=600 \
          --cov=src.pipeline_v3 \
          --cov-append \
          --junit-xml=test-results/lightweight-integration-results.xml \
          -m "integration and not heavy and not e2e"

    - name: Run server-specific tests
      run: |
        uv run pytest src/pipeline_v3/tests/integration/ -v \
          --timeout=900 \
          --cov=src.pipeline_v3 \
          --cov-append \
          --junit-xml=test-results/server-results.xml \
          -m "server"

    - name: Run E2E tests (critical path)
      run: |
        uv run pytest src/pipeline_v3/tests/integration/ -v \
          --timeout=1200 \
          --cov=src.pipeline_v3 \
          --cov-append \
          --junit-xml=test-results/e2e-results.xml \
          -m "e2e"

    - name: Run heavy resource tests (optional)
      run: |
        uv run pytest src/pipeline_v3/tests/integration/ -v \
          --timeout=1800 \
          --cov=src.pipeline_v3 \
          --cov-append \
          --junit-xml=test-results/heavy-results.xml \
          -m "heavy"
      continue-on-error: true  # Allow failures for heavy tests

    - name: Run regression tests
      run: |
        uv run pytest src/pipeline_v3/tests/regression/ -v \
          --cov=src.pipeline_v3 \
          --cov-append \
          --junit-xml=test-results/regression-results.xml
      continue-on-error: true  # Allow some failures

    - name: Generate coverage report
      run: |
        uv run coverage xml
        uv run coverage html
        uv run coverage report --show-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results/

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports
        path: |
          coverage.xml
          htmlcov/

    - name: Check test summary
      if: always()
      run: |
        echo "Test Summary:"
        echo "============="
        passed=$(grep -r "passed" test-results/*.xml | wc -l || echo 0)
        failed=$(grep -r "failed" test-results/*.xml | wc -l || echo 0)
        echo "Passed: $passed"
        echo "Failed: $failed"

        # Fail if core tests fail (unit, security, basic integration)
        if [ -f test-results/unit-results.xml ]; then
          unit_failures=$(grep -c 'failures="[1-9]' test-results/unit-results.xml || echo 0)
          if [ $unit_failures -gt 0 ]; then
            echo "Unit tests failed!"
            exit 1
          fi
        fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install linting tools
      run: |
        uv pip install --system ruff black isort mypy

    - name: Run ruff
      run: ruff check src/pipeline_v3 --output-format=github

    # Skip black and isort since we're using ruff for both linting and formatting
    # - name: Run black
    #   run: black --check src/pipeline_v3

    # - name: Run isort
    #   run: isort --check-only src/pipeline_v3

    - name: Run mypy
      run: mypy src/pipeline_v3 --ignore-missing-imports
      continue-on-error: true  # Allow mypy failures for now

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: success() || (needs.test.result == 'success' && needs.lint.result == 'failure')

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Build package
      run: |
        uv build
        ls -la dist/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  # Matrix testing for different Python versions and OS
  compatibility:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: true  # Don't fail the whole workflow

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          powershell -c "irm https://astral.sh/uv/install.ps1 | iex"
        else
          curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
        fi
      shell: bash

    - name: Install dependencies
      run: |
        uv sync --all-extras --dev

    - name: Run quick smoke test
      env:
        SKIP_QDRANT_CHECK: "true"
      run: |
        uv run python -m src.pipeline_v3.cli_main --help
        # Run only tests that don't require Qdrant server
        uv run pytest src/pipeline_v3/tests/unit/test_cli_simple.py -v -m "not requires_qdrant_server"
