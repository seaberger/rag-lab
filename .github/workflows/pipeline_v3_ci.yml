name: Pipeline v3 CI

on:
  push:
    branches: [ main, develop, 'feature/*' ]
    paths:
      - 'src/pipeline_v3/**'
      - 'tests/**'
      - '.github/workflows/pipeline_v3_ci.yml'
      - 'pyproject.toml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/pipeline_v3/**'
      - 'tests/**'
      - '.github/workflows/pipeline_v3_ci.yml'
      - 'pyproject.toml'

env:
  PYTHON_VERSION: '3.12'
  UV_VERSION: '0.5.13'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better caching

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Cache uv dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install dependencies
      run: |
        uv sync --all-extras --dev
        uv pip install pytest-timeout

    - name: Create test environment
      run: |
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
        mkdir -p test_data

    - name: Run unit tests
      run: |
        uv run pytest src/pipeline_v3/tests/unit/ -v \
          --cov=src.pipeline_v3 \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --junit-xml=test-results/unit-results.xml

    - name: Run security tests
      run: |
        uv run pytest src/pipeline_v3/tests/security/ -v \
          --cov=src.pipeline_v3 \
          --cov-append \
          --junit-xml=test-results/security-results.xml

    - name: Run integration tests (non-Qdrant)
      run: |
        uv run pytest src/pipeline_v3/tests/integration/ -v \
          -k "not search and not vector and not e2e" \
          --cov=src.pipeline_v3 \
          --cov-append \
          --junit-xml=test-results/integration-results.xml

    # Skip Qdrant tests in CI until server mode is implemented (Issue #71)
    # These tests hang in GitHub Actions due to file lock contention
    # - name: Run search/Qdrant tests
    #   run: |
    #     uv run pytest src/pipeline_v3/tests/integration/test_search_integration.py -v \
    #       --cov=src.pipeline_v3 \
    #       --cov-append \
    #       --junit-xml=test-results/search-results.xml
    #   continue-on-error: true  # Allow failures until Qdrant server mode

    # Skip E2E tests in CI until server mode is implemented (Issue #71)
    # These tests also use Qdrant and can hang in GitHub Actions
    # - name: Run E2E tests
    #   run: |
    #     uv run pytest src/pipeline_v3/tests/integration/test_e2e_integration.py -v \
    #       --timeout=600 \
    #       --cov=src.pipeline_v3 \
    #       --cov-append \
    #       --junit-xml=test-results/e2e-results.xml
    #   continue-on-error: true  # Allow failures until Qdrant server mode

    - name: Run regression tests
      run: |
        uv run pytest src/pipeline_v3/tests/regression/ -v \
          --cov=src.pipeline_v3 \
          --cov-append \
          --junit-xml=test-results/regression-results.xml
      continue-on-error: true  # Allow some failures

    - name: Generate coverage report
      run: |
        uv run coverage xml
        uv run coverage html
        uv run coverage report --show-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results/

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports
        path: |
          coverage.xml
          htmlcov/

    - name: Check test summary
      if: always()
      run: |
        echo "Test Summary:"
        echo "============="
        passed=$(grep -r "passed" test-results/*.xml | wc -l || echo 0)
        failed=$(grep -r "failed" test-results/*.xml | wc -l || echo 0)
        echo "Passed: $passed"
        echo "Failed: $failed"

        # Fail if core tests fail (unit, security, basic integration)
        if [ -f test-results/unit-results.xml ]; then
          unit_failures=$(grep -c 'failures="[1-9]' test-results/unit-results.xml || echo 0)
          if [ $unit_failures -gt 0 ]; then
            echo "Unit tests failed!"
            exit 1
          fi
        fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install linting tools
      run: |
        uv pip install --system ruff black isort mypy

    - name: Run ruff
      run: ruff check src/pipeline_v3 --output-format=github

    - name: Run black
      run: black --check src/pipeline_v3

    - name: Run isort
      run: isort --check-only src/pipeline_v3

    - name: Run mypy
      run: mypy src/pipeline_v3 --ignore-missing-imports
      continue-on-error: true  # Allow mypy failures for now

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: success() || (needs.test.result == 'success' && needs.lint.result == 'failure')

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Build package
      run: |
        uv build
        ls -la dist/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  # Matrix testing for different Python versions and OS
  compatibility:
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: true  # Don't fail the whole workflow

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          powershell -c "irm https://astral.sh/uv/install.ps1 | iex"
        else
          curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
        fi
      shell: bash

    - name: Install dependencies
      run: |
        uv sync --all-extras --dev

    - name: Run quick smoke test
      run: |
        uv run python -m src.pipeline_v3.cli_main --help
        uv run pytest src/pipeline_v3/tests/unit/test_cli_simple.py -v
