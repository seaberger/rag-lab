[tool:pytest]
# Pytest configuration for Pipeline v3 tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may require external resources)
    slow: Slow tests (>1s execution time)
    smoke: Quick integration tests for CI smoke testing
    server: Qdrant server specific tests
    e2e: End-to-end tests with full pipeline
    heavy: Resource-intensive tests with API calls
    security: Security-focused tests
    requires_api: Tests that require API keys
    requires_qdrant_server: Tests that require Qdrant server to be running

# Coverage settings
addopts =
    --strict-markers
    -ra
    --cov-branch

# Timeout for tests (in seconds)
timeout = 600
timeout_method = thread

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::PytestUnknownMarkWarning
