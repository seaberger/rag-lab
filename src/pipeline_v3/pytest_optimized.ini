[tool:pytest]
# Optimized pytest configuration for Pipeline v3 tests
# Designed to minimize resource conflicts

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# Run tests more carefully to avoid conflicts
addopts =
    --strict-markers
    -ra
    --tb=short
    --maxfail=5
    -p no:xvfb
    # Don't run tests in parallel by default
    -n 0
    # Increase timeout for slow operations
    --timeout=300
    --timeout-method=thread
    # Show slowest tests
    --durations=10

# Test markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may require external resources)
    slow: Slow tests (>1s execution time)
    security: Security-focused tests
    requires_api: Tests that require API keys
    qdrant: Tests that use Qdrant (should run serially)
    database: Tests that use databases (may have lock conflicts)

# Coverage settings
[coverage:run]
branch = True
source = src.pipeline_v3

[coverage:report]
show_missing = True
skip_covered = True

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnknownMarkWarning
    # Ignore Qdrant local mode warnings
    ignore:Payload indexes have no effect:UserWarning
    ignore:.*datetime.utcnow.*:DeprecationWarning
    ignore:.*search.*deprecated.*:DeprecationWarning
